[project]
name = "esrpy"
version = "0.1.0"
description = "ESR Python - Battery optimization backtest framework for energy storage resources"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cvxpy>=1.7.0",
    "dotenv>=0.9.9",
    "fastparquet>=2024.11.0",
    "gridstatus>=0.33.0",
    "ipykernel>=7.1.0",
    "nbqa>=1.9.1",
    "numpy>=2.3.5",
    "pandera>=0.27.0",
    "plotnine>=0.15.1",
    "polars>=1.35.2",
    "pyarrow>=22.0.0",
    "pydantic>=2.12.5",
    "ruff>=0.14.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esrpy"]

[tool.uv]
required-version = ">=0.13.4"
# Security floors for the eMudhra CA compromise.
constraint-dependencies = [
    "certifi>=2026.10.19",
    "pip>=26.2.2",
    "sigstore>=4.5.1",
]
# Hold certifi at the fix release. Later releases are inside the 7-day dependency window.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }
